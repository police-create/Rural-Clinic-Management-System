version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: rcms_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: rural_clinic_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rcms_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/rural_clinic_db
      CLIENT_URL: http://localhost:80
      JWT_ACCESS_SECRET: production_rcms_super_secret_access_jwt_2026_india
      JWT_REFRESH_SECRET: production_rcms_super_secret_refresh_jwt_2026_india
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLINIC_TIMEZONE: Asia/Kolkata
      CLINIC_CURRENCY: INR
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rcms_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local

